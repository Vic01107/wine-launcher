# Wine Launcher - Pre-commit hooks
# Install: pip install pre-commit && pre-commit install
# Run: pre-commit run --all-files

repos:
  # Code formatting
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.11
        args: ["--line-length=100", "--target-version=py310"]

  # Import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=100"]

  # Linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=100", "--extend-ignore=E203,W503"]
        additional_dependencies: [flake8-bugbear, flake8-comprehensions]

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        args: ["--strict", "--ignore-missing-imports", "--python-version=3.10"]
        additional_dependencies: [types-PyYAML, types-requests]
        exclude: ^tests/

  # Security
  - repo: https://github.com/pycqa/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ["-r", ".", "-x", "tests/", "--skip", "B101,B601"]
        exclude: ^tests/

  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-logger
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Python specific
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: pyproject-fmt
      - id: check-ast
      - id: check-docstring-first

ci:
  autofix_commit_msg: "chore: pre-commit auto-fixes"
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "chore: pre-commit auto-update"
  autoupdate_schedule: weekly
  skip: []
  submodules: false