[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-launcher"
version = "0.1.0"
description = "Run Windows applications on Linux using Wine/Proton with a modern Qt6 GUI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Emulators",
    "Topic :: Desktop Environment",
]
keywords = ["wine", "proton", "windows", "games", "bottle", "launcher", "qt6"]
authors = [
    {name = "Wine Launcher Contributors", email = "https://github.com/Vic01107/wine-launcher"}
]
urls = {
    "Homepage" = "https://github.com/Vic01107/wine-launcher",
    "Repository" = "https://github.com/Vic01107/wine-launcher",
    "Issues" = "https://github.com/Vic01107/wine-launcher/issues",
    "Changelog" = "https://github.com/Vic01107/wine-launcher/releases",
}

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "flake8>=7.1.0",
    "flake8-bugbear>=24.1.0",
    "flake8-comprehensions>=3.14.0",
    "mypy>=1.9.0",
    "bandit>=1.7.0",
    "pre-commit>=3.6.0",
    "pyinstaller>=6.3.0",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

[project.scripts]
wine-launcher = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "services*", "controllers*", "views*"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = "\.py$"
exclude = """
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
)/
"""

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
per-file-ignores = [
    "tests/*: F401, F811",
    "main.py: F401",
]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "C",   # mccabe complexity
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "PySide6.*",
    "pytest*",
    "tests.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "gui: Tests requiring display",
]

[tool.coverage.run]
source = ["models", "services", "controllers", "views"]
omit = ["tests/*", "main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", ".git", "build", "dist"]
skip = ["B101", "B601"]  # assert, shell injection (controlled)
confidence_level = "medium"
severity_level = "medium"

[tool.pre-commit-ci]
autofix_commit_msg = "chore: pre-commit auto-fixes"
autofix_prs = true
autoupdate_branch = ""
autoupdate_commit_msg = "chore: pre-commit auto-update"
autoupdate_schedule = "weekly"